name: MLB props report

# Regenerates the Longball Board report AND the NCAAF game-line model's
# report from live data and publishes both to the same GitHub Pages site -
# MLB at the site root (public/index.html), NCAAF under public/ncaaf/ (see
# ncaaf_main.py). One workflow, one Pages deployment: GitHub Pages replaces
# the entire published tree on every deploy, so both products have to be
# (re)built in the same job or one would silently wipe out the other's
# pages on its own next run. Runs on a GitHub-hosted runner, which has
# normal outbound internet access - unlike a sandboxed Claude Code session,
# it can actually reach baseballsavant.mlb.com, statsapi.mlb.com,
# api.collegefootballdata.com, api.open-meteo.com, and The Odds API. Every
# run re-fetches everything fresh; nothing is cached between runs.
#
# Setup (one-time):
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      -> name it ODDS_API_KEY, value = your free API key from
#      https://the-odds-api.com (no card needed - signup emails you a key
#      instantly). Used by both products (MLB player props and NCAAF game
#      lines). BETSTAMP_API_KEY also works instead for the MLB side only -
#      see mlb_props_main.build_providers(). Optional: BALLPARKPAL_API_KEY
#      (from ballparkpal.com's own API Access page) upgrades MLB
#      park/weather scoring with real per-hitter modeled factors - see
#      mlb_props/ballparkpal.py. Each report runs fine without its optional
#      key; nothing else changes if one is unset.
#   2. New repository secret -> name it CFBD_API_KEY, value = your free
#      College Football Data API key from
#      https://collegefootballdata.com/key (email signup, key emailed
#      instantly, no card). Required for the NCAAF report to run for real -
#      without it, the NCAAF steps below are skipped entirely for that run
#      (the MLB report still publishes normally).
#   3. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   4. Run this workflow once manually (Actions tab -> "MLB props report" ->
#      "Run workflow") to publish the first version; after that the daily
#      schedule below keeps it current. The schedule only fires once this
#      file is on the repo's default branch - trigger it manually from a
#      feature branch in the meantime.
#   Nothing else to set up for either product's real track record/
#   Performance page - no new secret, no external database. It just needs
#   `permissions.contents: write` (already set) so this workflow can commit
#   its own generated history back to the repo.
#
# The published pages always reflect the most recent successful run - open
# either any time for the current slate/week, or click "Run workflow" for
# an on-demand refresh.
#
# Every run also grows this repo's real track record under data/ (MLB:
# picks/, results/, clv/ - one JSONL file per day, see mlb_props/results.py;
# NCAAF: ncaaf/picks/, ncaaf/results/, ncaaf/clv/ - one JSONL file per real
# season/week, see ncaaf/results.py) and republishes each product's own
# performance.html from its own data (mlb_props/backtest.py +
# performance_report.py; ncaaf/backtest.py + ncaaf/performance_report.py) -
# each product's own "is this model actually working" dashboard, linked
# from that product's nav. The git repo IS the database for both: a final
# step below commits any changed data/ files straight back to this
# workflow's own branch, which is why `permissions.contents` is `write`
# here (every other permission stays read-only/deploy-only).

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date (YYYY-MM-DD), or 'today'"
        required: false
        default: "today"
      min_ev:
        description: "Minimum model EV%% required to show a prop"
        required: false
        default: "0"
      books:
        description: "Restrict odds to these sportsbook IDs, space-separated. Leave blank for the default (fanduel draftkings betmgm betrivers espnbet williamhill_us fliff betparx - 'espnbet' is theScore Bet's real Odds API key, 'williamhill_us' is Caesars). Type 'all' for every book Odds API returns."
        required: false
        default: ""
      live_odds_scan:
        description: "Also run --live-odds-scan (checks already-started games' odds for real cross-book price value; printed to this job's log, not the published report)."
        type: boolean
        required: false
        default: false
      game_status_check:
        description: "Also run --game-status-check (prints MLB's own authoritative real-time game status for every game today, straight from the MLB Stats API; printed to this job's log, not the published report)."
        type: boolean
        required: false
        default: false
      lineup_diagnostic:
        description: "Also run --lineup-diagnostic (diagnostic: reports each of today's real games' confirmed-lineup status - see mlb_props/schedule.py's MlbStatsApiScheduleProvider._confirmed_lineup_batters docstring, the real `battingOrder` boxscore field it reads was never confirmed against a real response. Printed to this job's log, not the published report)."
        type: boolean
        required: false
        default: false
      ballparkpal_matchups_check:
        description: "Also run --ballparkpal-matchups-check (diagnostic: prints summary stats for Ballpark Pal's /api/v1/matchups probability fields to resolve whether they're per-PA or per-game; printed to this job's log, not the published report). Requires BALLPARKPAL_API_KEY."
        type: boolean
        required: false
        default: false
      betstamp_diagnostic:
        description: "Also run --betstamp-diagnostic (diagnostic: calls Betstamp's real /api/markets endpoint directly and reports how many real PropLines parsed - see odds_monitor/providers/betstamp.py's module docstring, its field names/required params were never confirmed against a real response. Printed to this job's log, not the published report). Requires BETSTAMP_API_KEY."
        type: boolean
        required: false
        default: false
      historical_backtest_hot_streak:
        description: "Also run --historical-backtest-hot-streak over --backtest-start-date/--backtest-end-date (diagnostic: backtests the hot/cold z-score + clearance-rate signal against real past MLB games, the one part of the model checkable against history without lookahead bias - see mlb_props/historical_backtest.py. Printed to this job's log, not the published report)."
        type: boolean
        required: false
        default: false
      backtest_start_date:
        description: "First real date (YYYY-MM-DD) for --historical-backtest-hot-streak."
        required: false
        default: ""
      backtest_end_date:
        description: "Last real date (YYYY-MM-DD, inclusive) for --historical-backtest-hot-streak."
        required: false
        default: ""
      name_lookup_check:
        description: "Space-separated player full names (e.g. 'Gunnar Henderson' 'Pete Alonso' - quote each name) to check directly against the real Baseball Savant leaderboard, isolated from the rest of the pipeline. Leave blank to skip. Printed to this job's log, not the published report."
        required: false
        default: ""
      record_clv:
        description: "Also snapshot current odds for --date's already-recorded picks to compute closing-line value (mlb_props/results.py's record_closing_odds) - normally only the 2:30 UTC cron does this, run automatically."
        type: boolean
        required: false
        default: false
  schedule:
    # Four times daily, timed around the real US MLB slate - both its
    # earliest getaway/Sunday day games (first pitch as early as ~12:35pm
    # ET) and its latest West Coast night games (~10:10pm ET) - and around
    # The Odds API's real cost model: each odds call costs `markets x
    # regions` credits PER STILL-PREGAME GAME at that moment (3 markets x
    # 2 regions = 6 credits/game here - regions defaults to "us,us2", not
    # just "us", because ESPN Bet's real odds live under "us2" - see
    # odds_monitor/providers/theoddsapi.py), never a flat per-run cost. A
    # full ~15-game slate costs up to ~90 credits per run that catches it
    # pregame (the site no longer does a separate live-odds fetch every
    # run - the in-game cross-book "Live Right Now" section was removed
    # as unreliable with the books this project tracks; --live-odds-scan
    # remains as a manual, log-only diagnostic, not part of this
    # schedule). Combined, this schedule lands at roughly ~180-270
    # credits/day worst case (~5,400-8,100/month) - still comfortably
    # inside a real paid-tier budget, but adjust cadence/regions down if
    # your actual plan is closer to the 500-credit/month free tier. All
    # times below are UTC, since GitHub Actions schedule: doesn't support
    # local time.
    #
    # 15:00 UTC (~11am ET / 8am PT) - after probable pitchers are typically
    # posted, well before first pitch. Good for the day's early model-only
    # read before real odds exist yet for most games.
    - cron: "0 15 * * *"
    # 16:00 UTC (~12:00pm ET / 9am PT) - added specifically to catch that
    # day's early/day games, which the 11am and 6:30pm checks both
    # structurally miss: too early at 11am (odds for most games, day games
    # included, typically aren't posted yet), and by 6:30pm any day game
    # has already started or finished, so the pregame safety net
    # (_filter_lines_to_confirmed_pregame_games) correctly drops its real
    # odds rather than showing stale/live prices. Timed right before the
    # earliest realistic first pitch (~12:35pm ET) to give books the most
    # possible time to have posted lines for that day's early games while
    # still catching them pregame.
    - cron: "0 16 * * *"
    # 22:30 UTC (~6:30pm ET / 3:30pm PT) - mid-slate, right around when the
    # bulk of evening games start and books have posted real player-prop
    # boards for the day - the highest-market-coverage check of the four.
    - cron: "30 22 * * *"
    # 2:30 UTC (~10:30pm ET / 7:30pm PT) - after the last first pitches of
    # a normal slate, including the latest West Coast games. Dedicated to
    # snapshotting closing-line value for today's already-recorded picks
    # (see the "Record closing-line value" step below) - this is
    # deliberately close to lock, not right at first pitch, so the
    # "closing" price it records is genuinely close to the real closing
    # line, not just another mid-day snapshot.
    - cron: "30 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pybaseball pandas reportlab

      - name: Restore the last published NCAAF board as this run's baseline
        # public/ is rebuilt from scratch every run (nothing is cached
        # between runs - see this file's top comment) and
        # actions/deploy-pages REPLACES the entire live site with whatever
        # this run's artifact contains. The NCAAF live-data report below is
        # deliberately throttled to once a real day (see its own comment,
        # and this file's CFBD_API_KEY setup note) to stay inside CFBD's
        # real 1,000-call/month free tier - without this restore step, any
        # run that skips regenerating it (three of the schedule's four
        # daily fires) would deploy a public/ tree with NO
        # public/ncaaf/index.html at all, taking the published NCAAF board
        # offline until the next throttled run. `data/ncaaf/last_report/`
        # is this project's own committed copy of the most recent real
        # report (written by that throttled step, further down) - restored
        # here as a baseline BEFORE anything else runs, so a fresh
        # regeneration (when it does happen) naturally overwrites it, and
        # a skipped run still deploys real, if slightly stale, content
        # instead of a 404. `|| true` so a first-ever run (nothing
        # published yet) doesn't fail this step.
        run: |
          mkdir -p public/ncaaf
          cp data/ncaaf/last_report/index.html public/ncaaf/index.html 2>/dev/null || true
          cp data/ncaaf/last_report/report.txt public/ncaaf/report.txt 2>/dev/null || true

      - name: Generate report from live data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETSTAMP_API_KEY: ${{ secrets.BETSTAMP_API_KEY }}
          BALLPARKPAL_API_KEY: ${{ secrets.BALLPARKPAL_API_KEY }}
          BOOKS_INPUT: ${{ inputs.books }}
        run: |
          mkdir -p public
          # --max-candidates raised from the CLI default of 30: a real run
          # against a full slate (2026-08-27T03:29 UTC) completed in ~32s
          # at 30 candidates, so there's ample headroom in this job's
          # runtime to score more of the slate's roster before the cheap
          # phase-1 prefilter cuts anyone off - broader coverage, same
          # per-run cost profile.
          #
          # BOOKS_ARGS is built from the env var (not interpolated directly
          # into this script) to avoid shell-injection from the workflow_dispatch
          # input; --books is repeatable on the CLI, one flag per book.
          #
          # DEFAULT_BOOKS applies whenever BOOKS_INPUT is empty - which is
          # every scheduled run (the `schedule:` trigger has no `inputs`
          # context at all, so BOOKS_INPUT is always empty there, not just
          # "left blank") and any manual run that doesn't override it. Real
          # Odds API keys, confirmed live against the-odds-api.com's own
          # bookmaker list: 'espnbet' is theScore Bet's key (kept through
          # the ESPN Bet rebrand - the docs list it as "theScore Bet",
          # "Formerly ESPN Bet"); 'williamhill_us' is Caesars (see
          # mlb_props/market.py's BOOK_DISPLAY_NAMES). A manual run can
          # still type 'all' in the books field to see every book Odds
          # API returns, unrestricted.
          #
          # williamhill_us/fliff/betparx added 2026-09-05 after a real,
          # `--books all` diagnostic run's DEBUG logs showed the original
          # 5-book default was silently starving the HR ("agree" tier)
          # market: draftkings/betmgm/fanduel don't carry the
          # `batter_home_runs` market key in this account's live fetch at
          # all (confirmed: 0 outcomes across every event, every run),
          # leaving only betrivers+espnbet from the original list - and
          # betrivers only ever quotes the "Yes" side (0/246 players had
          # both Yes+No from betrivers across a real 15-game slate), so
          # `find_fair_prices` (needs one book with BOTH sides) had only
          # espnbet to work with. That makes `books_quoting >= 2`
          # (MIN_BOOKS_FOR_MARKET_AGREE, see edges.py) for HR structurally
          # near-impossible no matter how good the model is - not a small-
          # sample issue, a book-list issue. Same real diagnostic run
          # confirmed fliff and betparx are the other two books that
          # genuinely quote HR two-sided (278/278 and 239/246 players
          # respectively) - adding them gives `find_fair_prices` a real
          # shot at 2+ agreeing books for HR. williamhill_us (Caesars) is
          # single-sided-only for HR like betrivers, but it's a major real
          # book (the one that showed the +1500 price this fix was
          # originally prompted by) worth having in the single-sided
          # price-shopping fallback and the picks record either way.
          DEFAULT_BOOKS="fanduel draftkings betmgm betrivers espnbet williamhill_us fliff betparx"
          if [ -z "$BOOKS_INPUT" ]; then
            BOOKS_INPUT="$DEFAULT_BOOKS"
          fi
          BOOKS_ARGS=()
          if [ "$BOOKS_INPUT" != "all" ]; then
            for b in $BOOKS_INPUT; do
              BOOKS_ARGS+=(--books "$b")
            done
          fi
          # --performance-out deliberately NOT passed here even though this
          # invocation accepts it: writing it now would render from data/ as
          # of process start, before "Resolve yesterday's real outcomes" and
          # "Record closing-line value" below have appended THIS run's own
          # fresh data - stale by a full run, every run. The Performance
          # dashboard is instead (re)rendered as its own step, after those,
          # near the end of this job.
          python mlb_props_main.py \
            --date "${{ inputs.date || 'today' }}" \
            --min-ev "${{ inputs.min_ev || '0' }}" \
            --top 25 \
            --max-candidates 60 \
            "${BOOKS_ARGS[@]}" \
            --html-out public/index.html \
            --out public/report.txt \
            --pdf-out public/Longball_Board.pdf \
            --record-picks \
            --data-dir data \
            --log-level DEBUG

      - name: Upload the PDF as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: longball-board-pdf
          # public/report.txt/index.html already prove a run happened even
          # on a mostly-quiet slate; a missing PDF (e.g. reportlab install
          # hiccup - see mlb_props_main.py's --pdf-out handling, which never
          # fails the run for this) shouldn't fail the upload step too.
          path: public/Longball_Board.pdf
          if-no-files-found: warn
          retention-days: 14

      - name: Scan live-game odds for real cross-book value
        if: ${{ inputs.live_odds_scan }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BOOKS_INPUT: ${{ inputs.books }}
        run: |
          # Separate from the report above on purpose: this model has no
          # live-game-state awareness, so it never compares its score to a
          # live line (see odds_monitor/providers/theoddsapi.py) - this
          # only checks the one thing that's still valid without a model,
          # real cross-book price gaps on the same live bet. Printed here,
          # not published to Pages - it's a diagnostic, not a report.
          BOOKS_ARGS=()
          if [ -n "$BOOKS_INPUT" ]; then
            for b in $BOOKS_INPUT; do
              BOOKS_ARGS+=(--books "$b")
            done
          fi
          python mlb_props_main.py --live-odds-scan "${BOOKS_ARGS[@]}"

      - name: Cross-check real-time game status against MLB's own API
        if: ${{ inputs.game_status_check }}
        run: |
          # Independent of The Odds API's commence_time (confirmed live
          # 2026-08-29 to be wrong for at least one real game) - MLB's own
          # schedule endpoint is the actual source of truth for game state.
          python mlb_props_main.py --game-status-check --date "${{ inputs.date || 'today' }}"

      - name: Report today's real confirmed-lineup status per game
        if: ${{ inputs.lineup_diagnostic }}
        run: |
          # Verifies the real `battingOrder` boxscore field before it's
          # trusted live in scoring - see mlb_props/schedule.py's
          # MlbStatsApiScheduleProvider._confirmed_lineup_batters docstring.
          python mlb_props_main.py --lineup-diagnostic --date "${{ inputs.date || 'today' }}" --log-level DEBUG

      - name: Check Ballpark Pal matchups probability basis
        if: ${{ inputs.ballparkpal_matchups_check }}
        env:
          BALLPARKPAL_API_KEY: ${{ secrets.BALLPARKPAL_API_KEY }}
        run: |
          python mlb_props_main.py --ballparkpal-matchups-check --date "${{ inputs.date || 'today' }}"

      - name: Check Betstamp's real API response shape
        if: ${{ inputs.betstamp_diagnostic }}
        env:
          BETSTAMP_API_KEY: ${{ secrets.BETSTAMP_API_KEY }}
        run: |
          python mlb_props_main.py --betstamp-diagnostic --log-level DEBUG

      - name: Backtest the hot-streak signal against real MLB history
        if: ${{ inputs.historical_backtest_hot_streak }}
        run: |
          python mlb_props_main.py --historical-backtest-hot-streak \
            --backtest-start-date "${{ inputs.backtest_start_date }}" \
            --backtest-end-date "${{ inputs.backtest_end_date }}" \
            --log-level DEBUG

      - name: Check specific player names against the real Savant leaderboard
        if: ${{ inputs.name_lookup_check != '' }}
        env:
          NAME_LOOKUP_INPUT: ${{ inputs.name_lookup_check }}
        run: |
          # Parsed with Python's shlex (not eval/word-splitting) so a
          # workflow_dispatch input can't inject shell commands - same
          # shell-injection-avoidance posture as BOOKS_ARGS above, just
          # for a free-text field where names can contain spaces.
          NAMES=()
          while IFS= read -r name; do
            NAMES+=(--batters "$name")
          done < <(python3 -c "import shlex, sys; print(chr(10).join(shlex.split(sys.argv[1])))" "$NAME_LOOKUP_INPUT")
          python mlb_props_main.py --name-lookup-check "${NAMES[@]}"

      - name: Resolve yesterday's real outcomes
        run: |
          # Every run tries to resolve real outcomes for the previous real
          # calendar day (America/New_York, matching mlb_props_main.py's
          # own "today" convention) - by the time any run fires, yesterday's
          # games are safely final. Never the *current* --date: today's
          # games (if any already started) aren't done yet. A day with no
          # picks recorded (this feature's first day, or a quiet slate) is
          # a real no-op, not an error - see resolve_results_for_date's
          # docstring in mlb_props/results.py.
          YESTERDAY=$(TZ=America/New_York date -d "yesterday" +%Y-%m-%d)
          python mlb_props_main.py --resolve-results --date "$YESTERDAY" --data-dir data

      - name: Record closing-line value
        # Only the dedicated 2:30 UTC cron does this automatically (see the
        # `schedule:` comment above) - a manual run can also opt in via the
        # record_clv input. Not run on every trigger: the whole point of
        # "closing" is that it's the price right before lock, not another
        # mid-day snapshot.
        if: ${{ github.event.schedule == '30 2 * * *' || inputs.record_clv }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETSTAMP_API_KEY: ${{ secrets.BETSTAMP_API_KEY }}
        run: |
          # --log-level DEBUG, same as the main report step above - real
          # recorded CLV data (2026-09-04) showed a suspiciously long
          # "closing" price (a single book, williamhill_us, +4000 to +8000
          # on batter_home_runs) even after results.py's same-line fix
          # (see that module's _EXPECTED_LINE_FOR_MARKET docstring). This
          # step's fetch never had DEBUG logging before, so there was no
          # way to see the real point/price data behind that number - this
          # gives the next run's logs the same per-player point->price
          # dump theoddsapi.py already produces for the main step.
          python mlb_props_main.py --record-clv --date "${{ inputs.date || 'today' }}" --data-dir data --log-level DEBUG

      - name: Regenerate the Performance dashboard from this run's finalized data
        run: |
          # Confirmed live (2026-09-01): public/performance.html showed "0
          # real days of resolved picks collected" even with a genuinely
          # non-empty data/results/*.jsonl already committed to main -
          # because the main report step above wrote it from data/ as of
          # checkout, before "Resolve yesterday's real outcomes" (and, on
          # the 2:30 UTC cron, "Record closing-line value") had a chance to
          # add anything - so the dashboard was always exactly one full run
          # stale. This step re-renders it, after those, with
          # --performance-only so it never re-invokes the live-data
          # pipeline - no network calls, no Odds API credits spent, just
          # reads data/*.jsonl and writes one HTML file.
          python mlb_props_main.py --performance-only --performance-out public/performance.html --data-dir data

      - name: Determine the current real NCAAF season/week
        id: ncaaf_week
        # CFBD's real free tier caps usage at 1,000 calls/month (no card,
        # see collegefootballdata.com/key) - this cheap step (1 real call)
        # runs on both NCAAF cadences below so it's always ready for
        # whichever needs it, but the EXPENSIVE steps (full report
        # generation, ~14 real calls) are separately throttled to once a
        # day - see those steps' own `if:` conditions. `if:` conditions
        # can't reliably reference `secrets.*` directly (GitHub Actions
        # only guarantees secrets are available via `env:`/`${{ secrets.X
        # }}` in step inputs, not as a boolean in `if:`) - so the presence
        # check happens inside this step's shell instead, and every later
        # NCAAF step gates on this step's own `skip` OUTPUT (checked with
        # `== 'false'`, not `!= 'true'`, so a run where this step didn't
        # fire at all - an empty output - correctly skips everything
        # downstream too).
        if: ${{ github.event.schedule == '0 16 * * *' || github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "No CFBD_API_KEY secret configured - skipping the NCAAF report this run (MLB still publishes normally)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # Resolved once here (rather than separately inside each ncaaf_main.py
          # invocation below) so every step below - the main report, resolving
          # LAST week's real outcomes, and recording closing-line value - agrees
          # on the same real (season, week) for this run, and so the "previous
          # week" arithmetic (for resolving results) only has to happen once.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from ncaaf.cfbd import CfbdClient
          from ncaaf.schedule import current_season_week
          season, week, season_type = current_season_week(CfbdClient())
          print(f"season={season}")
          print(f"week={week}")
          print(f"season_type={season_type}")
          print(f"prev_week={max(1, week - 1)}")
          PY

      - name: Generate NCAAF report from live data
        # Throttled to once a real day (plus any manual run) - unlike MLB's
        # daily-turnover slate, a college football week barely changes
        # hour to hour, and this step alone costs ~14 real CFBD calls (see
        # ncaaf/ratings.py's module comments) - at the MLB schedule's full
        # 4x/day cadence that alone would blow through CFBD's real 1,000-
        # call/month free-tier cap by mid-month.
        if: ${{ steps.ncaaf_week.outputs.skip == 'false' && (github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch') }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p public/ncaaf
          python ncaaf_main.py \
            --season "${{ steps.ncaaf_week.outputs.season }}" \
            --week "${{ steps.ncaaf_week.outputs.week }}" \
            --season-type "${{ steps.ncaaf_week.outputs.season_type }}" \
            --min-ev 0 \
            --top 60 \
            --html-out public/ncaaf/index.html \
            --out public/ncaaf/report.txt \
            --record-picks \
            --data-dir data/ncaaf \
            --log-level DEBUG

      - name: Persist this NCAAF board as tomorrow's baseline
        # Same throttle as the step above (this only has something new to
        # persist when that step actually ran). Copied into data/ so the
        # existing "Commit real pick/result/CLV history" step further down
        # picks it up and commits it with everything else in one `git add
        # data/` - no separate commit logic needed. This is what the
        # "Restore the last published NCAAF board" step (top of this job)
        # reads back on a run that skips live regeneration.
        if: ${{ steps.ncaaf_week.outputs.skip == 'false' && (github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch') }}
        run: |
          mkdir -p data/ncaaf/last_report
          cp public/ncaaf/index.html data/ncaaf/last_report/index.html
          cp public/ncaaf/report.txt data/ncaaf/last_report/report.txt

      - name: Resolve NCAAF last week's real outcomes
        # Same once-a-day-plus-manual throttle as "Generate NCAAF report"
        # above (1 more real CFBD call) - see that step's comment.
        if: ${{ steps.ncaaf_week.outputs.skip == 'false' && (github.event.schedule == '0 16 * * *' || github.event_name == 'workflow_dispatch') }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          # Always the *previous* real week (never the current one - this
          # week's games aren't final yet): a week with no picks recorded
          # (season opener, or a quiet week) is a real no-op, not an error -
          # see resolve_results_for_week's docstring in ncaaf/results.py.
          python ncaaf_main.py --resolve-results \
            --season "${{ steps.ncaaf_week.outputs.season }}" \
            --week "${{ steps.ncaaf_week.outputs.prev_week }}" \
            --data-dir data/ncaaf

      - name: Record NCAAF closing-line value
        # Same "only the dedicated closing cron, or an explicit manual
        # opt-in" posture as the MLB step above - see its comment. Makes no
        # real CFBD network calls (only The Odds API) - CFBD_API_KEY is
        # still needed below purely so CfbdClient's constructor doesn't
        # raise, even though nothing calls it - so this isn't part of the
        # once-a-day CFBD-call throttle the two steps above use.
        if: ${{ steps.ncaaf_week.outputs.skip == 'false' && (github.event.schedule == '30 2 * * *' || inputs.record_clv) }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python ncaaf_main.py --record-clv \
            --season "${{ steps.ncaaf_week.outputs.season }}" \
            --week "${{ steps.ncaaf_week.outputs.week }}" \
            --data-dir data/ncaaf --log-level DEBUG

      - name: Regenerate the NCAAF Performance dashboard from this run's finalized data
        # Deliberately unconditional (no CFBD_API_KEY/ncaaf_week check) -
        # this makes zero real network calls of its own (just reads
        # data/ncaaf/*.jsonl, same as mlb_props' --performance-only), and
        # it needs to run every single time regardless of which NCAAF
        # steps above fired this run - it's the one piece of
        # public/ncaaf/* NOT covered by the baseline-restore step at the
        # top of this job, so skipping it on an off-cadence run would 404
        # public/ncaaf/performance.html instead of keeping it live and
        # current. A `data/ncaaf` directory that doesn't exist yet (a
        # repo's very first run, before any NCAAF data has ever been
        # recorded) still renders a real, honest "0 picks recorded" page -
        # see render_performance_report's handling of a missing/empty dir.
        run: |
          # Same "after resolve/CLV, so it's never a full run stale" fix as
          # the MLB Performance step above.
          python ncaaf_main.py --performance-only --performance-out public/ncaaf/performance.html --data-dir data/ncaaf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Commit real pick/result/CLV history
        run: |
          # The git repo is the database for this project's real track
          # record (see mlb_props/results.py) - no separate storage needed.
          # A no-op commit (nothing in data/ actually changed this run,
          # e.g. a quiet slate with zero picks) is skipped, not forced.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data/ changes this run - nothing to commit."
          else
            git commit -m "Record real pick/result/CLV history for $(TZ=America/New_York date +%Y-%m-%d)"
            # Confirmed live (2026-09-02): a plain push here can lose an
            # entire run's real data/deploy when another run (a manual
            # workflow_dispatch overlapping the schedule, or two scheduled
            # runs close together) commits to this branch first - "!
            # [rejected] HEAD -> main (fetch first)" fails this step, which
            # skips the deploy job below entirely (needs: build), so that
            # run's picks/results/CLV are recorded locally but never
            # pushed and the site never redeploys for it. Retries by
            # rebasing onto whatever landed in the meantime and pushing
            # again - safe here because every real conflict this file set
            # can have is two runs each appending different new lines to
            # the same date's JSONL, which rebase resolves as a clean
            # merge on its own; a genuine conflict (extremely unlikely -
            # would need the exact same line appended differently) aborts
            # loudly instead of forcing over real recorded history.
            for attempt in 1 2 3 4; do
              if git push origin "HEAD:${{ github.ref_name }}"; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Failed to push real pick/result/CLV history after 4 attempts - see the push errors above."
                exit 1
              fi
              echo "Push rejected (likely a concurrent run's commit landed first) - fetching and rebasing, attempt $attempt"
              git fetch origin "${{ github.ref_name }}"
              if ! git rebase "origin/${{ github.ref_name }}"; then
                echo "::error::Rebase conflict merging real data/ history - won't force over it. Manual resolution needed."
                git rebase --abort
                exit 1
              fi
              sleep $((2 ** attempt))
            done
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
